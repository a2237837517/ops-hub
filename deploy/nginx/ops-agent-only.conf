# ops-agent.example.com — public Agent endpoint only
#
# Use this when the Hub itself must stay private and only MCPHub may call
# /mcp. This config exposes ONLY the Agent WebSocket. The admin UI, /mcp,
# /api and downloads are not reachable through this domain.
#
# Public DNS: ops-agent.example.com -> edge nginx
# Internal:  edge nginx -> 127.0.0.1:7100
#
# If remote Agents do not need a public endpoint (same LAN/VPN), do not deploy
# this file at all. Bind the Hub to a private IP and let Agents connect there.

server {
    listen 80;
    server_name ops-agent.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ops-agent.example.com;

    ssl_certificate     /etc/nginx/certs/example.com.pem;
    ssl_certificate_key /etc/nginx/certs/example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/ops_agent_access.log main;
    error_log  /var/log/nginx/ops_agent_error.log error;

    client_max_body_size 16m;

    location /agent {
        proxy_pass http://127.0.0.1:7100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Explicitly deny everything else (UI, MCP, API, downloads).
    # Keep this block so a future location cannot accidentally expose them.
    location / {
        return 404;
    }
}
