# Add this to the MCPHub nginx site (mcp.example.com) to expose the Ops Hub
# admin UI under https://mcp.example.com/ops/.
#
# The trailing slash on proxy_pass strips /ops/ before forwarding to the Hub.
# Replace 127.0.0.1:7100 with the Hub's private address if it runs elsewhere.

location = /ops {
    return 301 /ops/;
}

location /ops/ {
    proxy_pass http://127.0.0.1:7100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 1024m;
    proxy_buffering off;
}
