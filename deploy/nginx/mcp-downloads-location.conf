# Add this location block to the MCPHub nginx site (mcp.example.com).
#
# It exposes ONLY the static Agent download page/files from Ops Hub:
#   https://mcp.example.com/downloads/
#
# The Ops Hub admin UI, /api and /mcp remain private. This block does not
# proxy those paths. Replace 127.0.0.1:7100 with the Hub's private address if
# the Hub runs on another host.

location = /downloads {
    return 301 /downloads/;
}

location /downloads/ {
    proxy_pass http://127.0.0.1:7100/downloads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 1m;
}
